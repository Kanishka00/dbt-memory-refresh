version: 2

models:
  - name: silver_customers
    description: "Cleaned and transformed customer data"

    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null

      - name: full_name
        data_tests:
          - not_null

      - name: email
        data_tests:
          - not_null

      - name: customer_category
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - PLATINUM
                  - GOLD
                  - SILVER